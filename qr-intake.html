<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zero@Production — QR Intake</title>
  <style>
    :root{
      --bg:#08101b;
      --card:#101a2a;
      --muted:#9fb0c7;
      --line:rgba(255,255,255,.08);
      --green:#005530;
      --navy:#02154e;
      --orange:#f9ba00;
      --red:#d51635;
      --white:#f5f7fb;
      --ok:#27c281;
      --warn:#ffb020;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Inter,Arial,sans-serif;
      background:
        radial-gradient(circle at top, rgba(0,85,48,.20), transparent 28%),
        radial-gradient(circle at right, rgba(249,186,0,.10), transparent 22%),
        linear-gradient(180deg,#07111d,#08101b 55%,#0a1524);
      color:var(--white);
    }
    .wrap{max-width:1180px;margin:0 auto;padding:24px}
    .topbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
    .back{
      display:inline-flex;align-items:center;gap:8px;text-decoration:none;
      color:#dce7ff;padding:10px 14px;border-radius:12px;border:1px solid var(--line);
      background:rgba(255,255,255,.03)
    }
    .hero{
      padding:18px;border-radius:20px;border:1px solid var(--line);
      background:linear-gradient(180deg,rgba(9,31,68,.72),rgba(8,24,55,.92));
      box-shadow:0 24px 70px rgba(0,0,0,.22)
    }
    .hero h1{margin:0 0 6px;font-size:28px}
    .muted{color:var(--muted)}
    .grid{display:grid;grid-template-columns:1.1fr .9fr;gap:18px;margin-top:18px}
    .card{
      padding:18px;border-radius:18px;border:1px solid var(--line);
      background:linear-gradient(180deg,rgba(16,26,42,.94),rgba(8,19,34,.98));
      box-shadow:0 18px 50px rgba(0,0,0,.18)
    }
    .row{display:grid;grid-template-columns:170px 1fr;gap:12px;align-items:center;margin-bottom:12px}
    label{font-size:13px;color:#cdd9ee;font-weight:700}
    input,select,textarea{
      width:100%;border:none;outline:none;border-radius:12px;padding:12px 14px;
      background:#0c1627;color:#f4f7ff;border:1px solid rgba(255,255,255,.07)
    }
    textarea{min-height:120px;resize:vertical}
    .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
    .btn{
      border:none;cursor:pointer;padding:12px 16px;border-radius:12px;
      font-weight:800;letter-spacing:.2px
    }
    .btn-primary{background:var(--orange);color:#111827}
    .btn-secondary{background:#13233c;color:#e9f1ff;border:1px solid rgba(255,255,255,.08)}
    pre{
      margin:0;white-space:pre-wrap;word-break:break-word;font-size:12px;line-height:1.45;
      color:#dfe8fb;background:#091321;border:1px solid rgba(255,255,255,.07);
      padding:14px;border-radius:14px;min-height:360px
    }
    .pill{
      display:inline-flex;align-items:center;justify-content:center;
      min-width:92px;padding:7px 12px;border-radius:999px;font-size:12px;font-weight:800
    }
    .ok{background:rgba(39,194,129,.12);color:#86efac;border:1px solid rgba(39,194,129,.34)}
    .warn{background:rgba(255,176,32,.12);color:#ffd37a;border:1px solid rgba(255,176,32,.34)}
    .note{
      margin-top:14px;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.03);
      border:1px solid rgba(255,255,255,.06);font-size:13px;color:#c9d5eb
    }
    @media (max-width: 920px){
      .grid{grid-template-columns:1fr}
      .row{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <a class="back" href="intake-hub.html">← Back to Intake Hub</a>
      <span class="pill ok">QR ACTIVE</span>
    </div>

    <div class="hero">
      <h1>QR / Mobile Scan Intake</h1>
      <div class="muted">Fast structured capture for batch, pallet, machine, station and operator-side scan events.</div>
    </div>

    <div class="grid">
      <div class="card">
        <div class="row">
          <label for="qrCodeValue">Scan Value</label>
          <input id="qrCodeValue" type="text" value="BATCH:EK-2026-0315-LOT07" />
        </div>

        <div class="row">
          <label for="qrScanType">Scan Type</label>
          <select id="qrScanType">
            <option value="batch">batch</option>
            <option value="pallet">pallet</option>
            <option value="machine">machine</option>
            <option value="station">station</option>
            <option value="operator">operator</option>
          </select>
        </div>

        <div class="row">
          <label for="qrFacility">Facility</label>
          <input id="qrFacility" type="text" value="Ekoten" />
        </div>

        <div class="row">
          <label for="qrSender">Scanned By</label>
          <input id="qrSender" type="text" value="floor.mobile@ekoten" />
        </div>

        <div class="row">
          <label for="qrPriority">Priority</label>
          <select id="qrPriority">
            <option value="normal">normal</option>
            <option value="high">high</option>
            <option value="critical">critical</option>
          </select>
        </div>

        <div class="row">
          <label for="qrNote">Operator Note</label>
          <textarea id="qrNote">Batch scanned at finishing entry gate. Hold for quality check.</textarea>
        </div>

        <div class="actions">
          <button class="btn btn-secondary" id="btnQrLoadSample" type="button">Load Sample</button>
          <button class="btn btn-secondary" id="btnQrNormalize" type="button">Normalize</button>
          <button class="btn btn-primary" id="btnQrCommit" type="button">Preflight + Commit</button>
        </div>

        <div class="note" id="qrIntakeStatus">Ready.</div>
      </div>

      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
          <div style="font-size:16px;font-weight:800;">Normalized Preview</div>
          <span class="pill warn">MOCK LOCAL</span>
        </div>
        <pre id="qrNormalizedPreview">{}</pre>
      </div>
    </div>
  </div>

  <script src="assets/js/qr-intake-adapter.js"></script>
</body>
</html>
